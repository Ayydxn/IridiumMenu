name: Build Dreamscape Menu

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: 🪟 Windows
            os: windows-2025-vs2026
          - name: 🍎 macOS
            os: macos-latest
          - name: 🍏 iOS
            os: macos-latest
            target: iOS
          - name: 🤖 Android 32-bit
            os: ubuntu-latest
            target: Android32
          - name: 🤖 Android 64-bit
            os: ubuntu-latest
            target: Android64

    steps:
      - name: Checkout Repository 
        uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package Builds
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Combine Builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build
